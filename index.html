<!DOCTYPE html>
<html lang="sw">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>R-AI Trinity</title>
<style>
:root{--bg:#0f1420;--card:#18202f;--txt:#e8ecf4;--mut:#8a96ad;--sade:#3b82f6;--fire:#f97316;--search:#22c55e;--bd:#26304a}
@media (prefers-color-scheme:light){:root{--bg:#f3f5fa;--card:#fff;--txt:#141a29;--mut:#5b667d;--bd:#dde3ef}}
:root[data-theme=dark]{--bg:#0f1420;--card:#18202f;--txt:#e8ecf4;--mut:#8a96ad;--bd:#26304a}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--txt);font:15px/1.5 system-ui,sans-serif;display:flex;flex-direction:column}
header{padding:10px 12px;border-bottom:1px solid var(--bd);padding-top:max(10px,env(safe-area-inset-top))}
.team{display:flex;gap:8px;justify-content:center}
.ai{display:flex;align-items:center;gap:6px;padding:6px 10px;border-radius:999px;background:var(--card);border:2px solid var(--bd);font-size:13px;font-weight:600}
.ai.active{border-color:var(--c)}
.av{width:26px;height:26px;border-radius:50%;background:var(--c);color:#fff;display:grid;place-items:center;font-size:13px;font-weight:700}
#status{text-align:center;color:var(--mut);font-size:13px;min-height:20px;margin-top:6px}
#chat{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:10px}
.msg{display:flex;gap:8px;max-width:100%}
.bub{background:var(--card);border:1px solid var(--bd);border-left:4px solid var(--c);border-radius:10px;padding:8px 10px;min-width:0;flex:1}
.nm{font-weight:700;font-size:13px;color:var(--c)}.kd{font-size:11px;color:var(--mut);margin-left:6px;font-weight:400}
.tx{white-space:pre-wrap;word-wrap:break-word;margin-top:2px}
.err .bub{border-left-color:#ef4444}
.src{margin-top:6px;font-size:12px;border-top:1px dashed var(--bd);padding-top:6px}
.src a{color:var(--c);display:block;word-break:break-all}.src small{color:var(--mut)}
.sade{--c:var(--sade)}.fire{--c:var(--fire)}.search{--c:var(--search)}
form{display:flex;gap:8px;padding:10px 12px;border-top:1px solid var(--bd);padding-bottom:max(10px,env(safe-area-inset-bottom));background:var(--bg)}
input{flex:1;padding:12px;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--txt);font-size:16px}
button{padding:0 18px;border:0;border-radius:10px;background:var(--sade);color:#fff;font-weight:700;font-size:15px}
button:disabled{opacity:.5}
</style>
</head>
<body>
<header>
  <div class="team">
    <div class="ai sade" id="ai-sade"><div class="av">S</div>Sade</div>
    <div class="ai fire" id="ai-fire"><div class="av">F</div>R-AI Fire</div>
    <div class="ai search" id="ai-search"><div class="av">R</div>R-AI Search</div>
  </div>
  <div id="status"></div>
</header>
<div id="chat"></div>
<form id="f"><input id="q" placeholder="Andika swali lako..." autocomplete="off" required><button id="b">Tuma</button></form>
<script>
const NAMES={sade:"Sade",fire:"R-AI Fire",search:"R-AI Search"},INIT={sade:"S",fire:"F",search:"R"};
const chat=document.getElementById("chat"),st=document.getElementById("status"),btn=document.getElementById("b");
function el(t,c,x){const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e}
function addMsg(m){
  const w=el("div","msg "+m.ai+(m.error?" err":""));
  const av=el("div","av",INIT[m.ai]);av.style.cssText="background:var(--c);flex:none;width:30px;height:30px;color:#fff;border-radius:50%;display:grid;place-items:center";
  const b=el("div","bub"),h=el("div","nm",NAMES[m.ai]);
  if(m.kind)h.appendChild(el("span","kd",m.kind));
  b.append(h,el("div","tx",m.text));
  if(m.sources&&m.sources.length){
    const s=el("div","src");
    m.sources.forEach(r=>{
      if(!/^https?:\/\//.test(r.url))return;
      const a=el("a",null,r.title||r.url);a.href=r.url;a.target="_blank";a.rel="noopener noreferrer";
      s.appendChild(a);
      const meta=[r.score!=null?"score "+r.score.toFixed(2):"",r.date||""].filter(Boolean).join(" · ");
      if(meta)s.appendChild(el("small",null,meta));
    });
    b.appendChild(s);
  }
  w.append(av,b);chat.appendChild(w);chat.scrollTop=chat.scrollHeight;
  document.querySelectorAll(".ai").forEach(a=>a.classList.remove("active"));
  document.getElementById("ai-"+m.ai).classList.add("active");
}
document.getElementById("f").onsubmit=async e=>{
  e.preventDefault();
  const q=document.getElementById("q");const question=q.value.trim();if(!question)return;
  q.value="";btn.disabled=true;
  const me=el("div","msg");const mb=el("div","bub",null);mb.style.setProperty("--c","var(--mut)");
  mb.append(el("div","nm","Wewe"),el("div","tx",question));me.appendChild(mb);chat.appendChild(me);
  try{
    const r=await fetch("/api/debate",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({question})});
    if(!r.ok||!r.body)throw new Error(await r.text());
    const rd=r.body.getReader(),dec=new TextDecoder();let buf="";
    for(;;){
      const {value,done}=await rd.read();if(done)break;
      buf+=dec.decode(value,{stream:true});
      let i;while((i=buf.indexOf("\n\n"))>=0){
        const blk=buf.slice(0,i);buf=buf.slice(i+2);
        const ev=(blk.match(/^event: (.*)$/m)||[])[1],d=(blk.match(/^data: (.*)$/m)||[])[1];
        if(!ev||!d)continue;const data=JSON.parse(d);
        if(ev==="status")st.textContent=data.text;
        else if(ev==="message")addMsg(data);
      }
    }
  }catch(err){addMsg({ai:"sade",kind:"Hitilafu",text:"Imeshindwa kuunganisha: "+err.message,error:true})}
  btn.disabled=false;
};
</script>
</body>
</html>
